<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عدد الأنشطة التجارية على Google Maps</title>
    <!-- إضافة مكتبة خرائط Google -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBMGgT9saWqnUZ1fmvMAu50aQ-foOorsOs&libraries=places"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #map-container {
            position: relative;
            width: 90%;
            max-width: 800px;
            height: 500px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            overflow: hidden;
            background-color: white;
            margin-bottom: 20px;
            animation: fadeIn 1.5s ease-out;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #count-display {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            animation: slideIn 1s ease-out;
        }

        #count-display i {
            margin-right: 8px;
            color: #ff5733;
        }

        #filter-container {
            margin-bottom: 20px;
            text-align: center;
        }

        #store-list {
            width: 90%;
            max-width: 800px;
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1.5s ease-out;
        }

        .store-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .store-item:last-child {
            border-bottom: none;
        }

        .store-name {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .store-address {
            font-size: 14px;
            color: #777;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
    <script>
        let stores = [];

        function initMap() {
            const center = { lat: 25.276987, lng: 55.296249 }; // مركز الخريطة
            const map = new google.maps.Map(document.getElementById("map"), {
                center: center,
                zoom: 14,
            });

            const service = new google.maps.places.PlacesService(map);

            // تحديث النتائج عند تغيير حدود الخريطة
            map.addListener('bounds_changed', () => {
                const bounds = map.getBounds();
                const request = {
                    bounds: bounds,
                    type: ['store'] // نوع النشاط التجاري
                };

                service.nearbySearch(request, (results, status) => {
                    if (status === google.maps.places.PlacesServiceStatus.OK) {
                        stores = results;
                        displayStores(results);
                        const countDisplay = document.getElementById('count-display');
                        countDisplay.innerHTML = `<i class="fas fa-store"></i> عدد الأنشطة التجارية: ${results.length}`;
                    }
                });
            });
        }

        function displayStores(stores) {
            const storeList = document.getElementById('store-list');
            storeList.innerHTML = '';

            stores.forEach(store => {
                const storeItem = document.createElement('div');
                storeItem.className = 'store-item';
                storeItem.innerHTML = `
                    <div>
                        <div class="store-name">${store.name}</div>
                        <div class="store-address">${store.vicinity}</div>
                    </div>
                `;
                storeList.appendChild(storeItem);
            });
        }

        function filterStores() {
            const filterText = document.getElementById('filter-input').value.toLowerCase();
            const filteredStores = stores.filter(store => store.name.toLowerCase().includes(filterText));
            displayStores(filteredStores);
        }
    </script>
</head>
<body onload="initMap()">
    <div id="map-container">
        <div id="map"></div>
        <div id="count-display"><i class="fas fa-spinner fa-spin"></i> ت البيانات...</div>
    </div>

    <div id="filter-container">
        <input type="text" id="filter-input" placeholder="ابحث عن متجر..." onkeyup="filterStores()">
    </div>

    <div id="store-list">
        <!-- سيتم عرض بيانات المحلات هنا -->
    </div>
</body>
</html>
